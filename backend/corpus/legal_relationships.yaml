# --------------------------------------------------------------------------- #
# What changed what — one entry per provision affected
# --------------------------------------------------------------------------- #
#
#   substitutes  the provision's text is REPLACED. The old text is historical.
#   amends       part of the provision's text is changed. The old text is
#                historical where it differs.
#   inserts      new text is added (a proviso, a sub-rule, a rule). The
#                existing text is not wrong, but it is no longer complete.
#
relationships:

  # -- trade licences: the chain the brief named ------------------------------
  - source: tn-ulb-rules-amend-35-2025
    relation: amends
    target: tn-ulb-rules-2023
    provision: "rule 290(1)"
    evidence: >-
      in rule 290, in sub-rule (1), for the expression "for a period of three
      years", the expression "upto the 31st day of March of the third year"
      shall be substituted

  - source: tn-ulb-rules-amend-164-2026
    relation: substitutes
    target: tn-ulb-rules-2023
    provision: "rule 290(1)"
    evidence: >-
      in rule 290, for sub-rule (1), the following sub-rule shall be
      substituted, namely:- "(1) A licence issued by the Commissioner under
      rule 289 shall be valid for a period of ten years from the date of issue
      and may be renewed for successive period of ten years."

  - source: tn-ulb-rules-amend-35-2025
    relation: inserts
    target: tn-ulb-rules-2023
    provision: "rule 289(1)"
    evidence: >-
      in rule 289,- (a) to sub-rule (1), the following proviso shall be added,
      namely:- "Provided that the Commissioner shall grant licence, for the
      trade or business other than the trade or business specified in the
      Schedules I, II and III."

  - source: tn-ulb-rules-amend-164-2026
    relation: inserts
    target: tn-ulb-rules-2023
    provision: "rule 289(1)"
    evidence: >-
      in rule 289, in sub-rule (1), after the proviso, the following proviso
      shall be added, namely:- "Provided further that the shops and the
      establishments, which are registered under the Tamil Nadu Shops and
      Establishments Act, 1947 (Tamil Nadu Act XXXVI of 1947), are exempted
      from obtaining separate licence under this rule in respect of the same
      premises and the same trade or business covered by such registration

  - source: tn-ulb-rules-amend-35-2025
    relation: inserts
    target: tn-ulb-rules-2023
    provision: "rule 300-A"
    evidence: >-
      after rule 300, the following rule shall be inserted, namely:- "300-A.
      Payment of licence fee.

  - source: tn-ulb-rules-amend-104-2025
    relation: substitutes
    target: tn-ulb-rules-2023
    provision: "rule 289(5)"
    evidence: >-
      in rule 289, in sub-rule (5), for the proviso, the following provisos
      shall be substituted, namely:-- "Provided that where the trade or
      business relates to Schedule II, except food retail and storage of
      goods, is to be carried out in a shop measuring areas up to 500 square
      feet, the Commissioner shall grant licence through self certification on
      the same day itself: Provided further that no licence shall be refused
      without giving an opportunity of being heard to the applicant."

