# How the documents in this corpus change one another.
#
# WHY THIS IS DECLARED AND NOT INFERRED. The tempting shortcut is "the newest
# document wins". It is wrong, and here is the counter-example from this very
# corpus: G.O. Ms. No. 164 of 3 September 2026 is the newest amendment to the
# Tamil Nadu Urban Local Bodies Rules, 2023, and it changes exactly two things —
# rule 290(1) and a proviso to rule 289(1). G.O. Ms. No. 104 of 2025 changed
# rule 289(5), G.O. Ms. No. 480 of 2025 changed rules 255 to 268, and NONE of
# those is touched by G.O. 164. A system that marked every earlier amendment
# superseded because a later one exists would tell a citizen that the
# same-day small-shop licence of G.O. 104 is no longer law. It is.
#
# So every relationship below names the PROVISION it affects, quotes the
# Gazette text that establishes it, and is read from that text — never from
# which file is newer.
#
# DATES. `issued` is the date printed on the Gazette notification and was read
# from it. `effective_from` is recorded ONLY where the source states it (an Act
# deemed in force from a date, or a commencement notification). Where it is
# not stated, it is left null and the service says the commencement date is
# PRESUMED to be publication — it does not silently assume it. A rule made
# under a statute ordinarily takes effect on publication in the Gazette, but
# "ordinarily" is not the same as "verified", and the difference is printed.
#
# Every entry was verified against the Gazette PDF at the URL in
# `corpus/tamil_nadu.yaml` on 2026-10-11, by fetching the document and
# extracting its text. Quoted evidence is verbatim.

version: 1
verified_on: "2026-10-11"

