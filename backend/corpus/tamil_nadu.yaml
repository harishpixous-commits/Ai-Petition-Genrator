# The government documents this service reasons from.
#
# WHAT THIS FILE IS. A manifest, not a cache. Every entry names a document by
# its official URL, says who issued it and what kind of document it is, and
# records when it was last verified to be downloadable. `scripts/fetch_corpus.py`
# reads this file, fetches what it names, checks it, and ingests it.
#
# WHY A MANIFEST AND NOT A FOLDER OF PDFs. Three reasons, all of which have
# cost somebody something before:
#
#   A corpus you cannot rebuild is a corpus you cannot trust. If the only copy
#   of a document is a file somebody downloaded once, nobody can tell whether
#   it is current, whether it was edited, or where it came from.
#
#   Government documents are superseded. An Act is amended, a Rule is replaced,
#   a town is reclassified. A manifest can record that; a folder cannot.
#
#   Nothing in this repository should be a copy of a government document. The
#   documents belong to the department that published them. This file points at
#   them.
#
# EVERY URL BELOW WAS FETCHED AND CONFIRMED to return HTTP 200 with a PDF body
# on the date in `verified`. That is a statement about reachability on that
# day, and nothing more: it is not a statement that the document is current
# law, which only the department can say.
#
# WHAT IS DELIBERATELY NOT HERE. Fund-release orders, staff postings, tender
# notices and award announcements. They are the bulk of what a Government
# Order portal contains and no citizen petition turns on any of them. The
# selection below is the material that decides a grievance: what the local body
# is obliged to do, who is responsible, and what procedure applies.

version: 1
state: "Tamil Nadu"

