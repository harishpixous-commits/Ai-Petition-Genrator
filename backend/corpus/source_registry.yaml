# The source directory this service LOOKS AT. Not the corpus itself.
#
# WHAT THIS FILE IS. A catalogue of official and discovery URLs the petition
# review assistant may use to find Acts, Rules, Government Orders, Gazette
# notifications, departmental circulars, court orders, and grievance-routing
# information for Tamil Nadu. Compiled from the operator brief dated 14
# October 2026.
#
# WHAT IT IS NOT. It is not a crawler schedule, it is not a cached snapshot of
# anybody's site, and it is NOT itself a legal citation. Rows below are
# addresses, nothing more. A document only enters the corpus (`tamil_nadu.yaml`)
# after a human curator has read it, verified its instrument type and legal
# status, and recorded the exact URL to the underlying PDF or signed order.
#
# WHY TIERS. The brief sets the controlling-source priority. The assistant must
# prefer tier_1 (Gazette or signed PDF) over tier_2 (current repository), over
# tier_3 (department website), over tier_4 (court portal), over tier_5
# (grievance portal — routing only), and never cite tier_6 (discovery) as the
# legal basis when any higher tier is available. Encoded here so the policy is
# machine-readable: the discovery script and the officer UI can both read it.
#
# ACCESS POLICY. Every entry declares how the source may be touched. `polite`
# means human-rate HTTP with the service's own User-Agent header, respecting
# robots.txt, no concurrent fetches. `manual` means a human curator must open
# the page in a browser (JS, CAPTCHA, session, pagination). `discovery_only`
# means the URL may be used to find search terms and nothing else.

version: 1
compiled_on: "2026-10-22"
notes: |
  THIS FILE DECIDES ONLY WHAT IS LOOKED AT.
  The corpus (`tamil_nadu.yaml`) decides what is cited.
  Nothing in this file is a legal source on its own.

# ------------------------------------------------------------------------- #
# Source-priority tiers. See `source_registry.py::SOURCE_PRIORITY`.
# ------------------------------------------------------------------------- #
tiers:
  - id: tier_1_gazette
    priority: 1
    name: "Gazette or signed PDF"
    description: >
      Original Gazette (ordinary, extraordinary, judicial) or an official
      signed government PDF for promulgation, notification, rule, amendment
      or commencement. The strongest evidence of a published statute,
      notification or Government Order.

  - id: tier_2_repository
    priority: 2
    name: "Current Act/Rule repository"
    description: >
      Current official repository for operative Act, Rule or regulation
      text — e.g. India Code, Legislative Department. Verify every item
      against the Gazette and later amendments.

  - id: tier_3_department
    priority: 3
    name: "Issuing department or authority website"
    description: >
      Issuing Tamil Nadu department, directorate, commissionerate or
      competent authority website for current procedures, forms, circulars,
      Citizen Charters and contacts.

  - id: tier_4_court
    priority: 4
    name: "Official court portal"
    description: >
      Madras High Court, Supreme Court or eCourts for judgments, final
      orders, daily orders, case status and procedural directions. Online
      status is not a certified copy.

  - id: tier_5_grievance
    priority: 5
    name: "Grievance/petition routing"
    description: >
      Official petition portals, grievance channels and CM Helpline. For
      intake, acknowledgement, routing and status only. NOT proof of a
      statutory right, appeal, limitation extension or final remedy.

  - id: tier_6_discovery
    priority: 6
    name: "Discovery only"
    description: >
      Wikipedia, blogs, commercial legal databases and non-governmental
      indexes. May be used to find search terms, instrument names and
      cross-check candidates. MUST NEVER be the controlling citation when
      any higher tier is available.

# ------------------------------------------------------------------------- #
# The source directory. Every row is a URL from the operator brief dated
# 14 October 2026. Fields:
#
#   id            Stable identifier, used by the discovery script and the
#                 officer UI to refer back to this entry.
#   name          Human-readable description.
#   url           The exact URL from the brief.
#   tier          Which priority tier (above).
#   kind          document | index | hub | search | directory | discovery
#   access        polite | manual | discovery_only
#   departments   Which departments this address covers, or ["all"].
#   captures      What the URL yields in practice (used by the discovery
#                 script to decide whether to download or just HEAD-check).
#   notes         Human notes — pagination quirks, JS requirements, scope.
# ------------------------------------------------------------------------- #

