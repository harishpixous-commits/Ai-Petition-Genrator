# ---------------------------------------------------------------------------
# SonarQube scanner configuration.
#
# CI configuration only. No application logic was added or changed for this.
#
# sonar.projectKey below was set by the repository owner to match the project
# that exists in the company SonarQube instance. It is NOT a placeholder — do
# not "correct" the spelling of `Ai-Petition-Genrator` to match the project
# name: the key must match SonarQube exactly, and changing it would silently
# create a new, unconfigured project instead of failing.
# ---------------------------------------------------------------------------

sonar.projectKey=Ai-Petition-Genrator
sonar.projectName=Ai-Petition-Generator
sonar.projectVersion=1.0.0

sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# What to analyse.
#
# Two languages are present and both are scanned:
#   Python     backend/app, backend/scripts
#   JavaScript backend/app/static/*.js  (~156 KB of vanilla JS — no framework,
#              no bundler, no package.json, so the source IS the artifact)
# ---------------------------------------------------------------------------
sonar.sources=backend/app,backend/scripts
sonar.tests=backend/tests

# Application floor is Python >= 3.11 (backend/pyproject.toml).
sonar.python.version=3.11,3.12

# ---------------------------------------------------------------------------
# Exclusions.
#
# Binary assets only. No source file is excluded from analysis.
# ---------------------------------------------------------------------------
sonar.exclusions=\
  backend/app/assets/fonts/**,\
  backend/app/assets/emblem/**,\
  backend/var/**,\
  **/__pycache__/**,\
  **/*.pyc

# ---------------------------------------------------------------------------
# NO COVERAGE CONFIGURATION IS DECLARED — deliberately.
#
# The repository has 656 test functions across 25 modules and they pass, but
# there is NO coverage tooling: pytest-cov is absent from
# backend/requirements-dev.txt and backend/pyproject.toml configures no
# coverage. Pointing Sonar at a coverage report that is never produced makes
# the scan warn on every run and reports 0% coverage, which is worse than
# reporting none at all.
#
# To enable coverage later (a repository change, not a deployment one):
#   1. add `pytest-cov` to backend/requirements-dev.txt
#   2. run: pytest --cov=app --cov-report=xml:coverage.xml
#   3. add here: sonar.python.coverage.reportPaths=backend/coverage.xml
# ---------------------------------------------------------------------------
