name: Build, Analyze and Deploy

# ---------------------------------------------------------------------------
# GitHub -> GitHub Actions -> SonarQube -> Docker Build -> Docker Hub (private)
#        -> SSH (appleboy) -> AWS EC2 -> Docker Compose -> Nginx -> Application
#
# ⚠️  THIS EC2 HOSTS THREE APPLICATIONS.
#
# Every Docker command below is scoped to the compose project
# `ai-petition-generator` or to this application's own image repository.
# There is NO global cleanup anywhere in this workflow:
#
#     NO  docker compose down          (unscoped)
#     NO  docker system prune
#     NO  docker image prune -af
#     NO  docker stop $(docker ps -q)
#     NO  docker rm $(docker ps -aq)
#
# The deployment additionally snapshots every OTHER container before and after
# and FAILS if any of them was stopped, restarted, recreated or removed.
#
# ONE image is built. There is no separate UI image: the frontend is vanilla
# JS/CSS/HTML inside the Python package, served by FastAPI itself.
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never let two deployments race onto the same host. This is a single-instance,
# single-worker service writing to one SQLite file.
concurrency:
  group: deploy-ai-petition-generator
  cancel-in-progress: false

env:
  IMAGE_NAME: subashawsdevops/ai-petition-generator
  COMPOSE_PROJECT: ai-petition-generator
  CONTAINER_NAME: ai-petition-generator
  VOLUME_NAME: ai_petition_generator_var

jobs:
  # =========================================================================
  # JOB 1 — Build and Analyze
  # =========================================================================
  build-and-analyze:
    name: Build and Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # SonarQube uses history for new-code detection and blame.
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # =========================================================================
  # JOB 2 — Deploy to EC2
  # =========================================================================
  deploy:
    name: Deploy to EC2
    needs: build-and-analyze
    runs-on: ubuntu-latest

    # Production credentials are supplied to this job, so it runs inside a
    # protected GitHub Environment rather than with repository-wide secrets.
    #
    # Two things follow from that, and the second is the point:
    #
    #   1. The provider keys are scoped to this environment. A workflow that
    #      is not this one cannot reach them.
    #   2. GitHub can require a named human to approve each run before the
    #      job starts. Configure that in Settings > Environments >
    #      production > Required reviewers. Without a reviewer configured
    #      the environment still scopes the secrets; it just does not pause.
    #
    # This is what the sister application on this host already does.
    environment: production

    # Company actor restriction — preserved exactly.
    if: >-
      github.actor == 'subashpixous' ||
      github.actor == 'harishpixous-commits' ||
      github.actor == 'PrithivRS' ||
      github.actor == 'loguTyson25'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # Immutable tag. The commit SHA is what EC2 deploys, so the host runs
      # exactly the image this run built — and every previous SHA stays
      # pullable for rollback.
      # -------------------------------------------------------------------
      - name: Resolve image tag
        id: meta
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "Image to build: ${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login here is for PUSHING from the runner. The EC2 host authenticates
      # separately via a ONE-TIME `docker login` performed during server setup
      # (deploy/README.md §3.5) — the token is never sent over SSH.
      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------------------------------------------------
      # ONE application image, built and pushed in a single step so the
      # pushed digest is exactly the one that was built.
      # -------------------------------------------------------------------
      - name: Build and push application image
        uses: docker/build-push-action@v6
        env:
          # Do not upload the Buildx build record (.dockerbuild) as a GitHub
          # artifact. It is a build-provenance blob we do not consume, and at
          # this image size (~1.2 GB, LibreOffice) it burns artifact storage on
          # every run for nothing.
          #
          # This affects ONLY artifact upload. The image is still built and
          # pushed identically, with the same tags, cache and digest.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          # The LibreOffice apt layer is ~1 GB and rarely changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # -------------------------------------------------------------------
      # Ship ONLY this application's deployment artifacts, ONLY into this
      # application's directory. Nothing outside EC2_APP_DIR is written.
      #
      # Nginx configuration is deliberately NOT shipped or reloaded by CI:
      # nginx is shared with two other applications, and a bad reload is the
      # one failure here with a blast radius beyond this app. Nginx changes
      # are a documented manual step (deploy/README.md §3.8).
      # -------------------------------------------------------------------
      - name: Ship compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          source: docker-compose.yml
          target: ${{ secrets.EC2_APP_DIR }}
          overwrite: true

      - name: Ship operational scripts to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          source: deploy/scripts/backup.sh,deploy/scripts/rollback.sh,deploy/scripts/preflight.sh,deploy/scripts/write-env.sh
          target: ${{ secrets.EC2_APP_DIR }}
          strip_components: 2
          overwrite: true

      # -------------------------------------------------------------------
      # Write app.env on the host from the repository's secrets.
      #
      # WHY CI WRITES IT NOW. It used to be created once, by hand, on the
      # EC2 — correct practice, and unusable here: the people who operate
      # this application have GitHub access and no SSH. The result was a
      # live service running for weeks with every AI feature switched off
      # because nobody who could see the problem could reach the file.
      #
      # Secrets go through `envs:` rather than being interpolated into the
      # script body. Interpolation pastes the key into the command text that
      # is assembled and echoed on failure; `envs:` hands it to the remote
      # shell as an environment variable instead.
      #
      # write-env.sh DERIVES LLM_PROVIDER, STREAM_ASR_PROVIDER and
      # TTS_PROVIDER from which keys are present, so the "key set but
      # provider off" state that caused the outage cannot be expressed at
      # all. ALLOW_EXTERNAL_AI is deliberately NOT derived — a key must
      # never open egress by existing. See the script.
      #
      # A missing OPERATOR_TOKEN or PUBLIC_ORIGIN aborts before writing, so
      # a deleted secret cannot blank a working configuration.
      # -------------------------------------------------------------------
      - name: Write runtime environment file from repository secrets
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          # A repository VARIABLE, not a secret: it is not confidential, and
          # permitting citizen data to leave this server should be visible
          # on the settings page rather than hidden among the keys.
          ALLOW_EXTERNAL_AI: ${{ vars.ALLOW_EXTERNAL_AI }}
          # Optional. Each one present switches on the feature it drives.
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          SARVAM_API_KEYS: ${{ secrets.SARVAM_API_KEYS }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          command_timeout: 5m
          envs: APP_DIR,OPERATOR_TOKEN,PUBLIC_ORIGIN,ALLOW_EXTERNAL_AI,GEMINI_API_KEYS,ANTHROPIC_API_KEY,GROQ_API_KEYS,OPENROUTER_API_KEYS,SARVAM_API_KEYS,DEEPGRAM_API_KEY,ASSEMBLYAI_API_KEY
          script: |
            set -Eeuo pipefail
            sudo chmod 0750 "${APP_DIR}/write-env.sh"
            sudo -E "${APP_DIR}/write-env.sh"

      # -------------------------------------------------------------------
      # Check the file that was just written, BEFORE anything is replaced.
      #
      # The deploy step already refuses to run when app.env is MISSING. It
      # never looked at what was in it. This prints variable NAMES only and
      # never a value.
      #
      # Run as root so the file can be read. It is 0600 and owned by the
      # deploy user, not by root: the deploy step below runs docker compose
      # as that user, and a root-owned env file fails there with
      # "open app.env: permission denied".
      # -------------------------------------------------------------------
      - name: Preflight the runtime environment file
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          command_timeout: 5m
          script: |
            set -Eeuo pipefail
            sudo chmod 0750 "${{ secrets.EC2_APP_DIR }}/preflight.sh"
            sudo env APP_DIR="${{ secrets.EC2_APP_DIR }}" \
                 "${{ secrets.EC2_APP_DIR }}/preflight.sh"

      # -------------------------------------------------------------------
      # Deploy.
      #
      #   inventory -> port pre-flight -> pull -> BACKUP -> scoped up -d
      #             -> verify GET / -> inventory diff
      #             -> scoped auto-rollback on failure
      # -------------------------------------------------------------------
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
          COMPOSE_PROJECT: ${{ env.COMPOSE_PROJECT }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          VOLUME_NAME: ${{ env.VOLUME_NAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          command_timeout: 20m
          envs: APP_IMAGE,IMAGE_TAG,APP_DIR,COMPOSE_PROJECT,CONTAINER_NAME,VOLUME_NAME
          script: |
            set -euo pipefail

            TS="$(date -u +%Y%m%d-%H%M%S)"
            HOST_UID="$(id -u)"
            HOST_GID="$(id -g)"
            INV_BEFORE="$(mktemp)"
            INV_AFTER="$(mktemp)"

            # Every compose invocation in this script goes through this
            # function, so the project scope can never be forgotten.
            dc() {
              docker compose -p "${COMPOSE_PROJECT}" -f "${APP_DIR}/docker-compose.yml" "$@"
            }

            # Snapshot of every container that is NOT ours: name, id and
            # start time. Detects stop, removal, recreation AND restart.
            #
            # The "is it ours?" filter is done INSIDE the loop, not with a
            # `grep -vx` in the pipeline. grep exits 1 when it selects no
            # lines, and on a host with no running containers (the first
            # deployment) that made the whole pipeline return 1 under
            # `set -o pipefail`, aborting the deploy before it started.
            # Keep the filtering here; do not reintroduce grep into this pipe.
            snapshot_others() {
              docker ps --format '{{.Names}}' \
                | sort \
                | while read -r n; do
                    [ -z "$n" ] && continue
                    [ "$n" = "${CONTAINER_NAME}" ] && continue
                    printf '%s\t%s\t%s\n' "$n" \
                      "$(docker inspect -f '{{.Id}}' "$n" 2>/dev/null || echo GONE)" \
                      "$(docker inspect -f '{{.State.StartedAt}}' "$n" 2>/dev/null || echo GONE)"
                  done
            }

            echo "=================================================="
            echo " Ai-Petition-Generator deployment"
            echo " image   : ${APP_IMAGE}:${IMAGE_TAG}"
            echo " project : ${COMPOSE_PROJECT}"
            echo " dir     : ${APP_DIR}"
            echo "=================================================="

            # ---------------------------------------------------------------
            # 1. Verify the deployment directory and its files.
            # ---------------------------------------------------------------
            if [ -z "${APP_DIR}" ]; then
              echo "FATAL: secret EC2_APP_DIR is empty."
              exit 1
            fi
            if [ ! -d "${APP_DIR}" ]; then
              echo "FATAL: ${APP_DIR} does not exist."
              echo "Run the one-time EC2 setup in deploy/README.md first."
              exit 1
            fi
            cd "${APP_DIR}"

            if [ ! -f docker-compose.yml ]; then
              echo "FATAL: ${APP_DIR}/docker-compose.yml is missing."
              exit 1
            fi
            if [ ! -f app.env ]; then
              echo "FATAL: ${APP_DIR}/app.env is missing."
              echo "Create it from deploy/env/app.env.example (mode 600)."
              exit 1
            fi
            chmod +x backup.sh rollback.sh 2>/dev/null || true

            # ---------------------------------------------------------------
            # 2. Verify the Docker toolchain.
            # ---------------------------------------------------------------
            echo "==> Verifying Docker toolchain"
            docker --version
            docker compose version

            # ---------------------------------------------------------------
            # 3. INVENTORY OF OTHER APPLICATIONS — BEFORE.
            # ---------------------------------------------------------------
            echo "==> Snapshotting other applications' containers (before)"
            snapshot_others > "${INV_BEFORE}"
            echo "    $(wc -l < "${INV_BEFORE}") other container(s) running:"
            cut -f1 "${INV_BEFORE}" | sed 's/^/      - /' || true

            # ---------------------------------------------------------------
            # 4. Verify / create THIS application's persistent volume.
            #    Created only when absent. Never removed, never recreated.
            # ---------------------------------------------------------------
            if docker volume inspect "${VOLUME_NAME}" >/dev/null 2>&1; then
              echo "==> Persistent volume ${VOLUME_NAME} present"
            else
              echo "==> Persistent volume ${VOLUME_NAME} absent - creating (first deployment)"
              docker volume create "${VOLUME_NAME}"
            fi
            mkdir -p "${APP_DIR}/backups"

            # Port 8000 is RESERVED for this application on this host.
            # Preserve an operator-set value rather than resetting it.
            APP_PORT="8000"
            if [ -f .env ]; then
              EXISTING_PORT="$(grep -E '^APP_PORT=' .env | cut -d= -f2- || true)"
              if [ -n "${EXISTING_PORT}" ]; then
                APP_PORT="${EXISTING_PORT}"
              fi
            fi

            # ---------------------------------------------------------------
            # 5. MANDATORY PORT PRE-FLIGHT.
            #
            #    Free                       -> continue
            #    Held by OUR container      -> continue (it is about to be
            #                                  recreated on the same port)
            #    Held by anything else      -> FAIL LOUDLY
            #
            #    This NEVER stops, restarts or reconfigures whatever holds the
            #    port, and NEVER silently picks a different port.
            # ---------------------------------------------------------------
            echo "==> Port pre-flight on 127.0.0.1:${APP_PORT}"
            PORT_HOLDER="$(docker ps --format '{{.Names}}|{{.Ports}}' \
                            | grep -F ":${APP_PORT}->" \
                            | cut -d'|' -f1 | head -1 || true)"

            if [ -n "${PORT_HOLDER}" ]; then
              if [ "${PORT_HOLDER}" = "${CONTAINER_NAME}" ]; then
                echo "    OK: port ${APP_PORT} is held by our own container"
              else
                echo ""
                echo "FATAL: PORT CONFLICT - DEPLOYMENT ABORTED"
                echo "  Port ${APP_PORT} is published by container '${PORT_HOLDER}',"
                echo "  which does NOT belong to Ai-Petition-Generator."
                echo ""
                echo "  Nothing has been changed. That container was NOT stopped,"
                echo "  restarted or reconfigured, and no alternative port was"
                echo "  chosen automatically."
                echo ""
                echo "  Resolve manually, then re-run:"
                echo "    - free port ${APP_PORT}, or"
                echo "    - set APP_PORT=<free-port> in ${APP_DIR}/.env AND update"
                echo "      'upstream ai_petition_upstream' in"
                echo "      /etc/nginx/conf.d/ai-petition-generator-shared.conf"
                exit 1
              fi
            elif ss -lnt 2>/dev/null | awk '{print $4}' | grep -qE "[:.]${APP_PORT}\$"; then
              echo ""
              echo "FATAL: PORT CONFLICT - DEPLOYMENT ABORTED"
              echo "  Port ${APP_PORT} is in use by a NON-CONTAINER process."
              echo "  Nothing has been changed. Investigate with:"
              echo "    sudo ss -lntp | grep ':${APP_PORT}'"
              exit 1
            else
              echo "    OK: port ${APP_PORT} is free"
            fi

            # ---------------------------------------------------------------
            # 6. Pull BEFORE stopping anything, so a registry failure never
            #    leaves the host with no running application.
            #
            #    The repository is PRIVATE. The host authenticates via a
            #    one-time `docker login` from server setup; no token is sent
            #    over SSH.
            # ---------------------------------------------------------------
            echo "==> Pulling ${APP_IMAGE}:${IMAGE_TAG}"
            if ! docker pull "${APP_IMAGE}:${IMAGE_TAG}"; then
              echo ""
              echo "FATAL: image pull failed."
              echo "  The Docker Hub repository is PRIVATE. If this is an"
              echo "  authentication error, re-run the ONE-TIME login on this host:"
              echo "    docker login docker.io --username subashawsdevops"
              echo "  (enter the access token interactively; see deploy/README.md §3.5)"
              echo ""
              echo "  Nothing was changed. The running application is untouched."
              exit 1
            fi

            # ---------------------------------------------------------------
            # 7. BACK UP SQLITE BEFORE THE CONTAINER IS REPLACED.
            #
            #    Uses SQLite's ONLINE .backup, never a cp of a live WAL
            #    database. Runs in a throwaway root container so it works
            #    whether or not the app is running.
            #
            #    The final chown is load-bearing: without it the backup files
            #    are root-owned, the retention sweep below (running as the
            #    login user) silently fails, backups accumulate forever and
            #    eventually fill the EBS volume SHARED WITH TWO OTHER APPS.
            # ---------------------------------------------------------------
            echo "==> Backing up SQLite databases (online .backup)"
            docker run --rm --user 0:0 \
              -e "TS=${TS}" \
              -e "HOST_UID=${HOST_UID}" \
              -e "HOST_GID=${HOST_GID}" \
              -v "${VOLUME_NAME}":/data \
              -v "${APP_DIR}/backups":/backups \
              --entrypoint /bin/sh \
              "${APP_IMAGE}:${IMAGE_TAG}" -c '
                set -eu
                for db in sessions knowledge; do
                  src="/data/${db}.sqlite"
                  dst="/backups/${TS}-${db}.sqlite"
                  if [ -f "$src" ]; then
                    echo "    backing up ${db}.sqlite"
                    sqlite3 "$src" ".backup ${dst}"
                    printf "    integrity: "
                    sqlite3 "$dst" "PRAGMA integrity_check;" | head -1
                  else
                    echo "    ${db}.sqlite not present (first deployment) - skipped"
                  fi
                done
                chown -R "${HOST_UID}:${HOST_GID}" /backups
              '

            # Retain the 20 most recent backups. Never a blanket delete.
            ls -1t "${APP_DIR}/backups"/*.sqlite 2>/dev/null \
              | tail -n +21 | xargs -r rm -f || true
            echo "    backups retained: $(ls -1 "${APP_DIR}/backups"/*.sqlite 2>/dev/null | wc -l)"

            # ---------------------------------------------------------------
            # 8. Record the current tag, then write the new one.
            # ---------------------------------------------------------------
            PREVIOUS_TAG=""
            if [ -f .env ]; then
              PREVIOUS_TAG="$(grep -E '^IMAGE_TAG=' .env | cut -d= -f2- || true)"
            fi
            if [ -n "${PREVIOUS_TAG}" ]; then
              printf '%s\n' "${PREVIOUS_TAG}" > .previous_tag
              echo "==> Previous tag recorded for rollback: ${PREVIOUS_TAG}"
            else
              echo "==> No previous tag (first deployment)"
            fi

            write_env() {
              printf 'APP_IMAGE=%s\nIMAGE_TAG=%s\nAPP_PORT=%s\n' \
                "${APP_IMAGE}" "$1" "${APP_PORT}" > .env
            }
            write_env "${IMAGE_TAG}"

            # ---------------------------------------------------------------
            # 9. Replace ONLY this application's container.
            #
            #    `up -d` recreates the service because the image tag changed.
            #    There is no `down`: less downtime, and the command is scoped
            #    to project ${COMPOSE_PROJECT} so it is structurally incapable
            #    of touching the other two applications.
            #
            #    --remove-orphans is scoped to THIS project only.
            # ---------------------------------------------------------------
            # A container of our name left behind by an older/differently
            # named project would block recreation. Remove that ONE container
            # by name if it is not part of our project.
            EXISTING_PROJECT="$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' \
                                 "${CONTAINER_NAME}" 2>/dev/null || true)"
            if [ -n "${EXISTING_PROJECT}" ] && [ "${EXISTING_PROJECT}" != "${COMPOSE_PROJECT}" ]; then
              echo "==> Container ${CONTAINER_NAME} belongs to legacy project"
              echo "    '${EXISTING_PROJECT}'. Removing that ONE container by name."
              echo "    (Its data volume ${VOLUME_NAME} is NOT touched.)"
              docker rm -f "${CONTAINER_NAME}"
            fi

            echo "==> Recreating service (project-scoped)"
            dc up -d --remove-orphans

            # ---------------------------------------------------------------
            # 10/11. Verify container state, then verify the app answers.
            #
            #    Gate is GET / — the static index, no network I/O.
            #    NOT /api/health, which probes every configured AI provider
            #    and runs a blocking soffice --version subprocess.
            # ---------------------------------------------------------------
            echo "==> Container status"
            dc ps

            echo "==> Verifying GET http://127.0.0.1:${APP_PORT}/"
            OK=0
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${APP_PORT}/" >/dev/null 2>&1; then
                OK=1
                echo "    application responded after ${i} attempt(s)"
                break
              fi
              sleep 5
            done

            # ---------------------------------------------------------------
            # 12. Application-scoped rollback on failure.
            # ---------------------------------------------------------------
            if [ "${OK}" -ne 1 ]; then
              echo ""
              echo "============================================================"
              echo "DEPLOYMENT VERIFICATION FAILED"
              echo "============================================================"
              echo "--- compose ps (this project only) ---"
              dc ps || true
              echo "--- last 200 log lines ---"
              dc logs --tail=200 --no-color || true
              echo "--- container state ---"
              docker inspect --format '{{json .State}}' "${CONTAINER_NAME}" 2>/dev/null || true

              if [ -s .previous_tag ]; then
                REVERT="$(cat .previous_tag)"
                echo ""
                echo "==> AUTO-ROLLBACK to ${REVERT} (this application only)"
                write_env "${REVERT}"
                dc up -d || true
                sleep 15
                dc ps || true
                if curl -fsS "http://127.0.0.1:${APP_PORT}/" >/dev/null 2>&1; then
                  echo "==> Rollback SUCCEEDED. Host is serving ${REVERT}."
                else
                  echo "==> ROLLBACK ALSO FAILED - MANUAL INTERVENTION REQUIRED."
                  echo "    See deploy/README.md 'Rollback procedure'."
                fi
              else
                echo "==> No previous tag to roll back to (first deployment)."
              fi

              echo ""
              echo "Citizen data was NOT touched. Volume ${VOLUME_NAME} is intact"
              echo "and a pre-deploy backup is in ${APP_DIR}/backups/ (prefix ${TS})."
              echo "The other two applications were NOT modified."
              exit 1
            fi

            # ---------------------------------------------------------------
            # 13. INVENTORY OF OTHER APPLICATIONS — AFTER.
            #
            #     Any difference means this deployment affected something it
            #     had no business touching. Fail, report exactly what changed,
            #     and DO NOT attempt any automatic repair of another app.
            # ---------------------------------------------------------------
            echo "==> Snapshotting other applications' containers (after)"
            snapshot_others > "${INV_AFTER}"

            if ! diff -u "${INV_BEFORE}" "${INV_AFTER}" > /tmp/inv_diff.txt 2>&1; then
              echo ""
              echo "============================================================"
              echo "ISOLATION VIOLATION - ANOTHER APPLICATION CHANGED"
              echo "============================================================"
              echo "Name / container-id / started-at differences:"
              cat /tmp/inv_diff.txt
              echo ""
              echo "This deployment was supposed to touch ONLY"
              echo "'${COMPOSE_PROJECT}'. NO automatic repair has been attempted"
              echo "on the affected application(s) - deliberately."
              echo ""
              echo "Ai-Petition-Generator is running ${APP_IMAGE}:${IMAGE_TAG}."
              echo "Investigate the change above before deploying again."
              exit 1
            fi

            echo "    verified: $(wc -l < "${INV_AFTER}") other container(s) unchanged"
            rm -f "${INV_BEFORE}" "${INV_AFTER}"

            # ---------------------------------------------------------------
            # 14. Image retention — scoped to OUR image repository only.
            #
            #     `docker image prune -af` / `docker system prune` are NEVER
            #     used: they would delete the other applications' images.
            #     This lists ONLY tags of ${APP_IMAGE} and removes specific
            #     tags by name.
            #
            #     ALWAYS protected: `latest`, the current tag, the previous
            #     tag. Of what remains, the 3 most recent are kept.
            # ---------------------------------------------------------------
            echo "==> Pruning old images of ${APP_IMAGE} only"
            KEEP_PREVIOUS="$(cat .previous_tag 2>/dev/null || true)"
            docker images "${APP_IMAGE}" --format '{{.Tag}}' \
              | grep -v '^<none>$' \
              | grep -v '^latest$' \
              | grep -v "^${IMAGE_TAG}$" \
              | { if [ -n "${KEEP_PREVIOUS}" ]; then grep -v "^${KEEP_PREVIOUS}$"; else cat; fi; } \
              | tail -n +4 \
              | while read -r old_tag; do
                  [ -z "${old_tag}" ] && continue
                  echo "    removing ${APP_IMAGE}:${old_tag}"
                  docker rmi "${APP_IMAGE}:${old_tag}" 2>/dev/null || true
                done || true

            echo ""
            echo "=================================================="
            echo " DEPLOYMENT SUCCESSFUL"
            echo "   image   : ${APP_IMAGE}:${IMAGE_TAG}"
            echo "   project : ${COMPOSE_PROJECT}"
            echo "   volume  : ${VOLUME_NAME} (intact)"
            echo "   port    : 127.0.0.1:${APP_PORT}"
            echo "   other apps: unchanged (verified)"
            echo "=================================================="
            dc ps
