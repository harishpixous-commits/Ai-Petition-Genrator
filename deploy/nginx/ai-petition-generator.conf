# ---------------------------------------------------------------------------
# Nginx reverse proxy — Citizen Petition Assistant
#
# Install on the EC2 host as:
#   /etc/nginx/sites-available/ai-petition-generator
# then symlink into sites-enabled. See deploy/README.md.
#
# ⚠️  REPLACE every CHANGE-ME value before enabling this site.
#
# Nginx is REQUIRED for this application, not optional. It supplies four
# things the application cannot do for itself:
#   1. TLS termination (the app has no TLS support at all)
#   2. A request body size cap  (the upload endpoint buffers the whole body
#      in memory before checking the 10 MB limit)
#   3. Rate limiting            (the application implements none)
#   4. Blocking the interactive API docs from the public internet
# ---------------------------------------------------------------------------

# Rate limiting for the API. The application has no rate limiting of its own,
# and its LLM/ASR providers are metered, so this is the only brake available.
limit_req_zone $binary_remote_addr zone=petition_api:10m rate=10r/s;

# Map for the WebSocket upgrade header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream petition_app {
    # Must match APP_PORT in <APP_DIR>/.env — docker-compose.yml publishes the
    # container port to the HOST LOOPBACK ONLY. Port 8000 must never appear in
    # the EC2 Security Group.
    server 127.0.0.1:8000;
    keepalive 16;
}

# --------------------------------------------------------------------------- #
# HTTP — ACME challenge and redirect to HTTPS
# --------------------------------------------------------------------------- #
server {
    listen 80;
    listen [::]:80;
    server_name CHANGE-ME.example.com;

    # Let's Encrypt HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------------- #
# HTTPS — the application
# --------------------------------------------------------------------------- #
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name CHANGE-ME.example.com;

    # -----------------------------------------------------------------------
    # TLS.
    #
    # HTTPS is MANDATORY here for a functional reason as well as a security
    # one: the browser only grants microphone access in a secure context, so
    # over plain HTTP the voice interface — the application's headline
    # feature — silently fails to initialise. The frontend selects wss://
    # from location.protocol automatically once the page is HTTPS.
    #
    # Paths below are what certbot --nginx writes. If TLS terminates at an
    # ALB with an ACM certificate instead, delete this whole server block's
    # ssl_* lines and listen on 80 behind the load balancer.
    # -----------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/CHANGE-ME.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHANGE-ME.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # -----------------------------------------------------------------------
    # Request body cap.
    #
    # The attachment endpoint reads the entire upload into memory
    # (`content = await file.read()`) and only THEN checks the 10 MB limit,
    # so an oversized body is a memory-exhaustion vector. 12m leaves headroom
    # above the application's own MAX_BYTES (10 MB) for multipart overhead.
    # -----------------------------------------------------------------------
    client_max_body_size 12m;
    client_body_timeout  120s;

    # -----------------------------------------------------------------------
    # Security headers.
    #
    # The application already sets X-Content-Type-Options, Referrer-Policy and
    # Cache-Control: no-store on /api/*. These are the ones only a proxy can
    # add. Enable HSTS only AFTER confirming HTTPS works end to end — it is
    # difficult to undo.
    # -----------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Logs. The application logs structured JSON to stdout via Docker; these
    # are the HTTP-level access logs.
    access_log /var/log/nginx/ai-petition-generator.access.log;
    error_log  /var/log/nginx/ai-petition-generator.error.log;

    # -----------------------------------------------------------------------
    # Interactive API documentation — blocked from the public internet.
    #
    # FastAPI serves /docs, /redoc and /openapi.json by default and the
    # application does not disable them. They map the entire API, including
    # the bulk-delete endpoint, for any anonymous caller.
    # -----------------------------------------------------------------------
    location = /docs        { return 404; }
    location = /redoc       { return 404; }
    location = /openapi.json { return 404; }

    # -----------------------------------------------------------------------
    # Operator screen — restricted to an admin network.
    #
    # ⚠️  This is defence in depth, NOT the primary control. OPERATOR_TOKEN
    # must be set in app.env regardless: behind any reverse proxy the
    # application's own "loopback only" fallback sees a local address for
    # EVERY request, which would otherwise publish the screen to the world.
    # -----------------------------------------------------------------------
    location /operator {
        allow 127.0.0.1;
        # allow CHANGE-ME-ADMIN-CIDR;   # e.g. your office / VPN range
        deny all;

        proxy_pass http://petition_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/operator/ {
        allow 127.0.0.1;
        # allow CHANGE-ME-ADMIN-CIDR;
        deny all;

        proxy_pass http://petition_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------------
    # Voice WebSocket.
    #
    # proxy_read_timeout MUST exceed the application's VOICE_IDLE_TIMEOUT_S
    # (180s default, backend/app/config.py). Nginx's default of 60s would
    # sever live voice sessions mid-petition.
    # -----------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://petition_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     off;
    }

    # -----------------------------------------------------------------------
    # API.
    #
    # proxy_read_timeout is generous because PDF conversion runs a LibreOffice
    # subprocess with a 120s timeout inside the application.
    # -----------------------------------------------------------------------
    location /api/ {
        limit_req zone=petition_api burst=20 nodelay;

        proxy_pass http://petition_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering    off;
    }

    # -----------------------------------------------------------------------
    # Everything else: the citizen page, /static and /assets.
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://petition_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 120s;
    }
}
