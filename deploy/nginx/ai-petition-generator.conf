# ---------------------------------------------------------------------------
# Ai-Petition-Generator — PHASE 1: HTTP bootstrap (no TLS)
#
# INSTALL AS:  /etc/nginx/sites-available/ai-petition-generator
#
# This is the file to enable FIRST, before any certificate exists.
#
# WHY TWO PHASES
#
# A config that references /etc/letsencrypt/live/<domain>/fullchain.pem before
# certbot has issued it makes `nginx -t` fail. On a three-application host that
# means no application can be reloaded until it is fixed. So: enable this
# HTTP-only file, obtain the certificate through the ACME webroot below, then
# swap in ai-petition-generator-tls.conf.
#
# REQUIRES:  /etc/nginx/conf.d/ai-petition-generator-shared.conf
#            (map / limit_req_zone / upstream live there)
#
# ---------------------------------------------------------------------------
# 🔴 REQUIRED MANUAL CONFIGURATION — replace before enabling
#
#   server_name   ->  your production FQDN   (line ~40)
#
# Do NOT use a wildcard or `default_server` here. Name-based routing is what
# keeps the other two applications' virtual hosts working untouched.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;

    # 🔴 REQUIRED MANUAL CONFIGURATION
    server_name CHANGE-ME.example.com;

    # ACME HTTP-01 challenge. Must stay reachable over plain HTTP even after
    # TLS is enabled, so certbot can renew.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # -----------------------------------------------------------------------
    # Request body cap.
    #
    # The upload endpoint reads the whole body into memory before checking its
    # own 10 MB limit, so an oversized request is a memory-exhaustion vector.
    # On a 4 GiB host shared with two other applications, that is everyone's
    # problem. 12m leaves headroom for multipart overhead above the app's
    # MAX_BYTES.
    # -----------------------------------------------------------------------
    client_max_body_size 12m;
    client_body_timeout  120s;

    access_log /var/log/nginx/ai-petition-generator.access.log;
    error_log  /var/log/nginx/ai-petition-generator.error.log;

    # -----------------------------------------------------------------------
    # Interactive API docs — blocked from the public internet.
    #
    # FastAPI serves these by default and the application does not disable
    # them. They map the entire API, including the bulk-delete endpoint.
    # -----------------------------------------------------------------------
    location = /docs         { return 404; }
    location = /redoc        { return 404; }
    location = /openapi.json { return 404; }

    # -----------------------------------------------------------------------
    # Operator screen — restricted.
    #
    # ⚠️  Defence in depth only. OPERATOR_TOKEN must be set in app.env
    # regardless: behind a reverse proxy the application's own "loopback only"
    # fallback sees a local address for EVERY request, which would otherwise
    # publish this screen to the world.
    #
    # 🔴 REQUIRED MANUAL CONFIGURATION: uncomment and set your admin CIDR.
    # -----------------------------------------------------------------------
    location /operator {
        allow 127.0.0.1;
        # allow REQUIRED-MANUAL-CONFIGURATION-ADMIN-CIDR;
        deny all;

        proxy_pass http://ai_petition_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location /api/operator/ {
        allow 127.0.0.1;
        # allow REQUIRED-MANUAL-CONFIGURATION-ADMIN-CIDR;
        deny all;

        proxy_pass http://ai_petition_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # -----------------------------------------------------------------------
    # Voice WebSocket.
    #
    # proxy_read_timeout MUST exceed the application's VOICE_IDLE_TIMEOUT_S
    # (180s default). Nginx's default 60s would sever live voice sessions
    # mid-petition.
    # -----------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://ai_petition_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $ai_petition_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }

    # -----------------------------------------------------------------------
    # API. Timeout is generous because PDF conversion runs a LibreOffice
    # subprocess with a 120s internal timeout.
    # -----------------------------------------------------------------------
    location /api/ {
        limit_req zone=ai_petition_api burst=20 nodelay;

        proxy_pass http://ai_petition_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering    off;
    }

    # Citizen page, /static and /assets.
    location / {
        proxy_pass http://ai_petition_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 120s;
    }
}
