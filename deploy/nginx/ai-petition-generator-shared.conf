# ---------------------------------------------------------------------------
# Ai-Petition-Generator — shared http-context directives
#
# INSTALL AS:  /etc/nginx/conf.d/ai-petition-generator-shared.conf
#
# WHY THIS FILE EXISTS
#
# `map`, `limit_req_zone` and `upstream` are http-context directives. If they
# lived inside the site file, then swapping the site between the HTTP
# bootstrap version and the TLS version — or briefly having both enabled —
# would define them TWICE and nginx would refuse to start with a "duplicate"
# error. On a server hosting three applications, a config error is not a
# local failure: `nginx -t` fails and NOTHING can be reloaded until it is
# fixed.
#
# Keeping them here means the site file can be swapped freely.
#
# ⚠️  EVERY IDENTIFIER BELOW IS PREFIXED `ai_petition_` ON PURPOSE.
#
# The conventional name for the WebSocket map variable is
# `$connection_upgrade`. It is the single most common name in nginx configs,
# so if either of the other two applications on this host defines it, nginx
# aborts with "duplicate map". Prefixing guarantees this application can never
# collide with theirs, and theirs can never collide with this one.
#
# Do not rename these to generic names.
# ---------------------------------------------------------------------------

# WebSocket upgrade mapping for the voice endpoint (/ws/).
map $http_upgrade $ai_petition_connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limiting for this application's API only.
#
# The application implements no rate limiting of its own, and its optional
# LLM/ASR providers are metered, so this is the only brake available.
# The zone name is application-scoped; it shares no state with other apps.
limit_req_zone $binary_remote_addr zone=ai_petition_api:10m rate=10r/s;

# Upstream = this application's container, published on the HOST LOOPBACK only
# by docker-compose.yml.
#
# ⚠️  The port here MUST match APP_PORT in /opt/ai-petition-generator/.env
#     (default 8000). If you change one, change the other.
#     This port is reserved for Ai-Petition-Generator on this host.
upstream ai_petition_upstream {
    server 127.0.0.1:8000;
    keepalive 16;
}
