# ---------------------------------------------------------------------------
# Ai-Petition-Generator — PHASE 2: production HTTPS
#
# INSTALL AS:  /etc/nginx/sites-available/ai-petition-generator
#              (REPLACES the phase-1 HTTP bootstrap file of the same name)
#
# ⚠️  ONLY install this AFTER certbot has issued the certificate. Referencing
#     a certificate that does not exist makes `nginx -t` fail, and on this
#     three-application host that blocks reloads for EVERY application.
#
#     Correct order is in deploy/README.md §3.8. Never skip `nginx -t`.
#
# REQUIRES:  /etc/nginx/conf.d/ai-petition-generator-shared.conf
#
# ---------------------------------------------------------------------------
# 🔴 REQUIRED MANUAL CONFIGURATION — 4 replacements before enabling
#
#   server_name          ->  your FQDN   (lines ~36 and ~52)
#   ssl_certificate      ->  your FQDN   (line ~62)
#   ssl_certificate_key  ->  your FQDN   (line ~63)
#   admin CIDR           ->  uncomment   (lines ~104 and ~117)
# ---------------------------------------------------------------------------

# --------------------------------------------------------------------------- #
# HTTP — ACME renewal + redirect to HTTPS
# --------------------------------------------------------------------------- #
server {
    listen 80;
    listen [::]:80;

    # 🔴 REQUIRED MANUAL CONFIGURATION
    server_name CHANGE-ME.example.com;

    # Must remain reachable over plain HTTP for certbot renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------------- #
# HTTPS — the application
# --------------------------------------------------------------------------- #
server {
    # ⚠️  UBUNTU 24.04 COMPATIBILITY — DO NOT "MODERNISE" THIS LINE.
    #
    # Ubuntu 24.04 LTS ships nginx 1.24.0. The separate `http2 on;` directive
    # was only introduced in nginx 1.25.1. Using it here makes `nginx -t` fail
    # with "unknown directive", which on a three-application host means no
    # application can be reloaded, and `systemctl restart nginx` would take
    # ALL THREE DOWN and refuse to start.
    #
    # The `http2` listen parameter below is the correct syntax for 1.24 and is
    # still accepted (deprecated, not removed) by 1.25+.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # 🔴 REQUIRED MANUAL CONFIGURATION
    server_name CHANGE-ME.example.com;

    # -----------------------------------------------------------------------
    # TLS.
    #
    # HTTPS is MANDATORY here for a functional reason as well as a security
    # one: browsers only grant microphone access in a secure context, so over
    # plain HTTP the voice interface — the application's headline feature —
    # silently fails to initialise. The frontend selects wss:// from
    # location.protocol automatically once the page is HTTPS.
    # -----------------------------------------------------------------------
    # 🔴 REQUIRED MANUAL CONFIGURATION (2 lines)
    ssl_certificate     /etc/letsencrypt/live/CHANGE-ME.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHANGE-ME.example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:ai_petition_ssl:10m;
    ssl_session_timeout 1d;

    client_max_body_size 12m;
    client_body_timeout  120s;

    # Headers only a proxy can add. The application already sets
    # X-Content-Type-Options, Referrer-Policy and Cache-Control: no-store
    # on /api/*.
    #
    # ⚠️  Enable HSTS only AFTER confirming HTTPS works end to end. It is
    #     cached by browsers and is difficult to undo.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/ai-petition-generator.access.log;
    error_log  /var/log/nginx/ai-petition-generator.error.log;

    location = /docs         { return 404; }
    location = /redoc        { return 404; }
    location = /openapi.json { return 404; }

    # 🔴 REQUIRED MANUAL CONFIGURATION: uncomment and set your admin CIDR.
    location /operator {
        allow 127.0.0.1;
        # allow REQUIRED-MANUAL-CONFIGURATION-ADMIN-CIDR;
        deny all;

        proxy_pass http://ai_petition_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location /api/operator/ {
        allow 127.0.0.1;
        # allow REQUIRED-MANUAL-CONFIGURATION-ADMIN-CIDR;
        deny all;

        proxy_pass http://ai_petition_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # Voice WebSocket. Timeout must exceed VOICE_IDLE_TIMEOUT_S (180s).
    location /ws/ {
        proxy_pass http://ai_petition_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $ai_petition_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }

    location /api/ {
        limit_req zone=ai_petition_api burst=20 nodelay;

        proxy_pass http://ai_petition_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering    off;
    }

    location / {
        proxy_pass http://ai_petition_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 120s;
    }
}
